---
- name: Wait for locks
  ansible.builtin.include_tasks:
    file: wait_for_locks.yml

- name: Install autofs packages
  ansible.builtin.package:
    name: "{{ openldap_autofs_pkgs }}"
    state: present
    update_cache: true

- name: Remove previously created autofs file if present
  ansible.builtin.file:
    path: /etc/defaults/autofs
    state: absent
  notify:
    - restart_autofs

- name: Include the directory master map
  ansible.builtin.lineinfile:
    path: /etc/auto.master
    regexp: "^\\s*#?\\s*\\+auto\\.master\\s*$"
    line: "+auto.master"
  notify:
    - restart_autofs

- name: Enable pam authentication in ssh server configuration
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    state: present
    regexp: ^.*UsePAM.*$
    line: UsePAM yes
  notify:
    - restart_login_services
  when:
    - ansible_system != 'OpenBSD'
  tags:
    - always

- name: Start rpcbind service (RHEL)
  ansible.builtin.systemd:
    name: rpcbind
    state: started
    enabled: true
  when: ansible_os_family == 'RedHat'

- name: Flush Handlers
  ansible.builtin.meta: flush_handlers

- name: Start AutoFS service
  ansible.builtin.systemd:
    name: autofs
    state: started
    enabled: true
